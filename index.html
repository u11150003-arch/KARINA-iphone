<!DOCTYPE html>
<html lang="zh-TW" style="--z: 1.0557;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>KARINA iPhone</title>

  <!-- Google Fonts: Montserrat (英數) + Noto Sans TC (繁中) + Noto Sans KR (韓文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #121316;
      --phone-w: min(100vw, calc(100dvh * 0.4605), 414px);
      --font-stack: "Montserrat", "Noto Sans TC", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-stack);
      overflow: hidden;
      color: #fff;
    }

    /* 手機外殼與精緻外框 */
    #phone {
      position: relative;
      width: var(--phone-w);
      aspect-ratio: 1260 / 2736;
      background: #000;
      overflow: hidden;
      color: #111;
    }
    @media (min-width: 500px) {
      #phone {
        border-radius: 52px;
        box-shadow: 0 0 0 11px #1f1f22, 0 0 0 13px #2d2d31, 0 35px 90px rgba(0,0,0,0.85);
      }
    }

    /* 頂部狀態列 */
    .status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14.5px;
      z-index: 1000;
      pointer-events: none;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .status .icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bat {
      display: inline-block;
      width: 23px;
      height: 11.5px;
      border: 1.5px solid currentColor;
      border-radius: 4px;
      position: relative;
    }
    .bat:after {
      content: "";
      position: absolute;
      inset: 1.5px;
      right: 4px;
      background: currentColor;
      border-radius: 1px;
    }

    /* 動態島 */
    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 106px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 1001;
      pointer-events: auto;
      cursor: pointer;
      transition: width 0.3s cubic-bezier(0.3, 0, 0, 1.3), height 0.3s cubic-bezier(0.3, 0, 0, 1.3), border-radius 0.3s;
    }
    .island.expand {
      width: 260px;
      height: 48px;
      border-radius: 24px;
    }

    /* 待機/鎖定桌布 (改為你指定的高清照片) */
    .wall {
      position: absolute;
      inset: 0;
      background-color: #0b0c10;
      background-image: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 100%),
        url("https://lh3.googleusercontent.com/d/1g3HAlT22-USHa9riT2oxtJVG6V0Q1Lcs");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* 螢幕層基礎切換 */
    .scr {
      position: absolute;
      inset: 0;
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
      color: #fff;
    }

    /* --- 1. 鎖定畫面 --- */
    #lock {
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 78px 24px 42px;
      text-align: center;
    }
    #lock.off {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    #lock .d {
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 12px rgba(0,0,0,0.6);
      margin-bottom: 2px;
      font-family: "Noto Sans TC", "Noto Sans KR", sans-serif;
    }
    #lock .t {
      font-size: 88px;
      font-weight: 500;
      letter-spacing: -3.5px;
      line-height: 0.92;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 20px rgba(0,0,0,0.5);
    }
    .lock-widgets {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .lock-actions {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }
    .act-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    #hint {
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      opacity: 0.9;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
      font-family: "Noto Sans TC", sans-serif;
    }
    @keyframes pulse {
      0%, 100% { transform: translateY(0); opacity: 0.55; }
      50% { transform: translateY(-4px); opacity: 0.95; }
    }

    /* --- 2. 密碼解鎖頁面 --- */
    #pass {
      z-index: 210;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #pass.on {
      opacity: 1;
      pointer-events: auto;
    }
    .pass-title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 25px;
      letter-spacing: -0.3px;
    }
    .pass-dots {
      display: flex;
      gap: 18px;
      margin-bottom: 45px;
    }
    .p-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      transition: background 0.15s;
    }
    .p-dot.filled {
      background: #fff;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 75px);
      gap: 16px 24px;
      justify-items: center;
    }
    .k-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s;
    }
    .k-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }
    .k-btn .n {
      font-size: 29px;
      font-weight: 400;
      line-height: 1;
    }
    .k-btn .sub {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 2px;
      opacity: 0.8;
    }

    /* --- 3. 主畫面 (Home) --- */
    #home {
      z-index: 10;
      padding: 68px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 22px;
      column-gap: 12px;
      justify-items: center;
    }
    .icon {
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .icon .img {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      position: relative;
    }
    .icon .img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .icon .name {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    /* 底部 Dock 欄 */
    .dock {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-radius: 35px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 25px rgba(0,0,0,0.3);
    }

    /* --- 4. App 視窗容器 --- */
    .app-screen {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 500;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .app-screen.active {
      transform: translateY(0%);
    }

    /* 解決頂部字被卡住：增加足夠的安全距離避開動態島 */
    #app-playlist {
      background: #000;
      padding-top: 56px; /* 預留下拉高度，字不再卡住 */
    }
    #app-playlist iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: block;
    }

    /* Instagram 模擬介面 */
    #app-instagram {
      background: #000;
      color: #fff;
      overflow-y: auto;
      padding-top: 52px;
    }
    .ig-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 0.5px solid #1f1f22;
    }
    .ig-body {
      padding: 16px 18px;
    }
    .ig-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .ig-ring {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(45deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .ig-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #000;
      overflow: hidden;
    }
    .ig-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ig-counts {
      display: flex;
      gap: 24px;
      text-align: center;
    }
    .ig-counts .n {
      font-weight: 700;
      font-size: 15px;
    }
    .ig-counts .l {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 2px;
    }
    .ig-bio .b-name {
      font-weight: 700;
      font-size: 13.5px;
    }
    .ig-bio .b-text {
      font-size: 13px;
      line-height: 1.45;
      color: #efeff1;
      margin-top: 3px;
    }
    .ig-bio a {
      color: #5ac8fa;
      text-decoration: none;
      font-size: 12.5px;
      display: inline-block;
      margin-top: 2px;
    }
    .ig-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
      margin-top: 18px;
    }
    .ig-cell {
      aspect-ratio: 1;
      background: #1c1c1e;
      overflow: hidden;
    }
    .ig-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- 5. 強化手勢底部返回條 (Home Indicator) --- */
    /* 建立一個 40px 高的感應觸控區，確保向上滑或點擊都能百分之百觸發 */
    .home-touch-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38px;
      z-index: 2100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none; /* 防止滑動手勢被瀏覽器攔截 */
    }
    .home-touch-area .bar {
      width: 138px;
      height: 5px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="phone">
  <!-- 狀態列 (點擊穿透) -->
  <div class="status">
    <span class="now-time">19:40</span>
    <div class="island" id="dynamic-island"></div>
    <div class="icons">
      <span style="font-size: 11px; font-weight:700;">5G</span>
      <div class="bat"></div>
    </div>
  </div>

  <!-- 待機/鎖定桌布 (照片已換成指定圖檔) -->
  <div class="wall"></div>

  <!-- 1. 鎖定畫面 -->
  <div id="lock" class="scr">
    <div class="lock-top">
      <div class="d" id="lock-date">10月20日 星期二</div>
      <div class="t now-time">19:40</div>
    </div>
    <div class="lock-widgets">
      <div class="lock-actions">
        <div class="act-btn">🔦</div>
        <div class="act-btn">📷</div>
      </div>
      <div id="hint">向上輕掃或點擊以解鎖</div>
    </div>
  </div>

  <!-- 2. PIN 密碼解鎖頁面 -->
  <div id="pass" class="scr">
    <div class="pass-title">輸入密碼</div>
    <div class="pass-dots">
      <div class="p-dot"></div>
      <div class="p-dot"></div>
      <div class="p-dot"></div>
      <div class="p-dot"></div>
    </div>
    <div class="keypad">
      <div class="k-btn" data-k="1"><span class="n">1</span><span class="sub">&nbsp;</span></div>
      <div class="k-btn" data-k="2"><span class="n">2</span><span class="sub">ABC</span></div>
      <div class="k-btn" data-k="3"><span class="n">3</span><span class="sub">DEF</span></div>
      <div class="k-btn" data-k="4"><span class="n">4</span><span class="sub">GHI</span></div>
      <div class="k-btn" data-k="5"><span class="n">5</span><span class="sub">JKL</span></div>
      <div class="k-btn" data-k="6"><span class="n">6</span><span class="sub">MNO</span></div>
      <div class="k-btn" data-k="7"><span class="n">7</span><span class="sub">PQRS</span></div>
      <div class="k-btn" data-k="8"><span class="n">8</span><span class="sub">TUV</span></div>
      <div class="k-btn" data-k="9"><span class="n">9</span><span class="sub">WXYZ</span></div>
      <div style="width:75px;height:75px;"></div>
      <div class="k-btn" data-k="0"><span class="n">0</span><span class="sub">&nbsp;</span></div>
      <div style="width:75px;height:75px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;" id="cancel-pass">取消</div>
    </div>
  </div>

  <!-- 3. 主畫面 (Home) -->
  <div id="home" class="scr">
    <div class="grid">
      <!-- KARINA PLAYLIST -->
      <div class="icon" data-target="playlist">
        <div class="img" style="background:#000;">
          <img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/playlist_cover.jpg"
               onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=140&auto=format&fit=crop&q=80'"
               alt="Playlist">
        </div>
        <span class="name">PLAYLIST</span>
      </div>

      <!-- Instagram -->
      <div class="icon" data-target="instagram">
        <div class="img" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <span class="name">Instagram</span>
      </div>

      <!-- 照片 -->
      <div class="icon">
        <div class="img" style="background:#fff;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="#ff2d55">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
        </div>
        <span class="name">照片</span>
      </div>

      <!-- 相機 -->
      <div class="icon">
        <div class="img" style="background:#636366;"><span style="font-size:26px;">📷</span></div>
        <span class="name">相機</span>
      </div>

      <!-- 備忘錄 -->
      <div class="icon">
        <div class="img" style="background:#fff; border-top:12px solid #ffd60a;"><span style="font-size:20px;">📝</span></div>
        <span class="name">備忘錄</span>
      </div>

      <!-- 設定 -->
      <div class="icon">
        <div class="img" style="background:#8e8e93;"><span style="font-size:24px;">⚙️</span></div>
        <span class="name">設定</span>
      </div>
    </div>

    <!-- 底部 Dock 欄 -->
    <div class="dock">
      <div class="icon"><div class="img" style="background:#34c759;"><span style="font-size:24px;">📞</span></div></div>
      <div class="icon"><div class="img" style="background:#007aff;"><span style="font-size:24px;">💬</span></div></div>
      <div class="icon"><div class="img" style="background:#5856d6;"><span style="font-size:24px;">🧭</span></div></div>
      <div class="icon" data-target="playlist"><div class="img" style="background:#111;"><span style="font-size:22px;">🎧</span></div></div>
    </div>
  </div>

  <!-- 4. KARINA PLAYLIST App (上緣已預留 56px 避開文字重疊) -->
  <div id="app-playlist" class="app-screen">
    <iframe 
      id="iframe-playlist"
      src="https://karinaplaylist.netlify.app"
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write *"
      sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
    ></iframe>
  </div>

  <!-- 5. Instagram App -->
  <div id="app-instagram" class="app-screen">
    <div class="ig-header">
      <span>katarinabluu</span>
      <span style="font-size: 20px; cursor: pointer;">≡</span>
    </div>
    <div class="ig-body">
      <div class="ig-stats-row">
        <div class="ig-ring">
          <div class="ig-avatar">
            <img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/avatar.jpg"
                 onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80'"
                 alt="Karina Avatar">
          </div>
        </div>
        <div class="ig-counts">
          <div><div class="n">411</div><div class="l">貼文</div></div>
          <div><div class="n">22.4M</div><div class="l">粉絲</div></div>
          <div><div class="n">4</div><div class="l">追蹤中</div></div>
        </div>
      </div>
      <div class="ig-bio">
        <div class="b-name">KARINA (유지민)</div>
        <div class="b-text">aespa</div>
        <a href="https://youtu.be/aespa_official" target="_blank">youtu.be/aespa_official</a>
      </div>
      <div class="ig-grid">
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post1.jpg" onerror="this.src='https://picsum.photos/400/400?random=21'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post2.jpg" onerror="this.src='https://picsum.photos/400/400?random=22'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post3.jpg" onerror="this.src='https://picsum.photos/400/400?random=23'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post4.jpg" onerror="this.src='https://picsum.photos/400/400?random=24'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post5.jpg" onerror="this.src='https://picsum.photos/400/400?random=25'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post6.jpg" onerror="this.src='https://picsum.photos/400/400?random=26'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post7.jpg" onerror="this.src='https://picsum.photos/400/400?random=27'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post8.jpg" onerror="this.src='https://picsum.photos/400/400?random=28'" alt="post"></div>
        <div class="ig-cell"><img src="https://raw.githubusercontent.com/u11150003-arch/KARINA-PLAYLIST/main/images/post9.jpg" onerror="this.src='https://picsum.photos/400/400?random=29'" alt="post"></div>
      </div>
    </div>
  </div>

  <!-- 全域強化版 Home 手勢條（支援點擊 + 向上滑動返回桌面） -->
  <div class="home-touch-area" id="home-indicator">
    <div class="bar"></div>
  </div>
</div>

<script>
  // 1. 即時時鐘與繁中日期更新
  function updateClock() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const str = `${hh}:${mm}`;
    document.querySelectorAll('.now-time').forEach(el => el.textContent = str);

    const opts = { month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('lock-date').textContent = d.toLocaleDateString('zh-TW', opts);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. 鎖定畫面點擊提示解鎖
  const lock = document.getElementById('lock');
  const pass = document.getElementById('pass');
  document.getElementById('hint').addEventListener('click', () => {
    pass.classList.add('on');
  });

  // 3. 密碼鍵盤邏輯
  let code = [];
  const dots = document.querySelectorAll('.p-dot');
  document.querySelectorAll('.k-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (code.length < 4) {
        code.push(btn.dataset.k);
        dots[code.length - 1].classList.add('filled');
      }
      if (code.length === 4) {
        setTimeout(() => {
          pass.classList.remove('on');
          lock.classList.add('off');
          code = [];
          dots.forEach(dot => dot.classList.remove('filled'));
        }, 180);
      }
    });
  });

  document.getElementById('cancel-pass').addEventListener('click', () => {
    pass.classList.remove('on');
    code = [];
    dots.forEach(dot => dot.classList.remove('filled'));
  });

  // 4. 動態島伸縮
  const island = document.getElementById('dynamic-island');
  island.addEventListener('click', () => {
    island.classList.toggle('expand');
  });

  // 5. 開啟 App 視窗
  const screens = {
    playlist: document.getElementById('app-playlist'),
    instagram: document.getElementById('app-instagram')
  };

  document.querySelectorAll('[data-target]').forEach(el => {
    el.addEventListener('click', () => {
      const target = el.dataset.target;
      if (screens[target]) {
        screens[target].classList.add('active');
      }
    });
  });

  // 6. 返回桌面核心邏輯（關閉 App）
  function goHome() {
    Object.values(screens).forEach(scr => scr.classList.remove('active'));
    if (island.classList.contains('expand')) island.classList.remove('expand');
  }

  // 7. 支援「點擊」與「向上滑動（Swipe Up）」手勢返回主畫面
  const homeBar = document.getElementById('home-indicator');
  
  // 點擊返回
  homeBar.addEventListener('click', goHome);

  // 向上滑動手勢監聽
  let touchStartY = 0;
  homeBar.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  homeBar.addEventListener('touchend', (e) => {
    const touchEndY = e.changedTouches[0].clientY;
    // 只要向上滑動超過 15px 即判定為上滑回主畫面
    if (touchStartY - touchEndY > 15) {
      goHome();
    }
  }, { passive: true });

  // 桌面端滑鼠拖拽上滑支援
  let mouseStartY = 0;
  let isMouseDown = false;
  homeBar.addEventListener('mousedown', (e) => {
    mouseStartY = e.clientY;
    isMouseDown = true;
  });
  window.addEventListener('mouseup', (e) => {
    if (isMouseDown) {
      if (mouseStartY - e.clientY > 15) {
        goHome();
      }
      isMouseDown = false;
    }
  });
</script>

</body>
</html>
